<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IP Block Manager</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: #1a202c;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 16px;
      padding: 30px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    h1 { font-size: 22px; color: #1a202c; margin-bottom: 20px; }
    h2 { font-size: 16px; color: #2d3748; margin: 16px 0 8px; }
    .input-group { display: flex; gap: 8px; margin-bottom: 12px; }
    input[type="text"], input[type="password"] {
      flex: 1;
      padding: 10px 14px;
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }
    input:focus { border-color: #1a202c; }
    button {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      font-weight: 500;
    }
    .btn-login { background: #1a202c; color: white; width: 100%; }
    .btn-block { background: #e53e3e; color: white; }
    .btn-unblock { background: none; color: #3182ce; font-size: 18px; cursor: pointer; }
    .btn-logout { background: #718096; color: white; width: 100%; margin-top: 12px; }
    .message { padding: 8px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 12px; }
    .success { background: #f0fff4; color: #22543d; }
    .error { background: #fff5f5; color: #c53030; }
    .ip-list { background: #f7fafc; border-radius: 8px; padding: 12px; max-height: 300px; overflow-y: auto; }
    .ip-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #e2e8f0; }
    .ip-item:last-child { border-bottom: none; }
    .ip-text { color: #e53e3e; font-family: monospace; font-size: 13px; }
    .empty { color: #a0aec0; text-align: center; padding: 20px; }
    .login-section { text-align: center; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚫 IP Block Manager</h1>
    
    <!-- Login Section -->
    <div id="loginSection">
      <p style="color:#718096; margin-bottom:12px; font-size:14px;">Enter password to access</p>
      <input type="password" id="password" placeholder="Password..." onkeypress="if(event.key==='Enter') login()">
      <br><br>
      <button class="btn-login" onclick="login()">Login</button>
      <div id="loginMsg"></div>
    </div>
    
    <!-- Admin Section -->
    <div id="adminSection" class="hidden">
      <h2>Add IP to Block</h2>
      <div class="input-group">
        <input type="text" id="ipInput" placeholder="Enter IP (e.g. 192.168.1.1)..." onkeypress="if(event.key==='Enter') blockIP()">
        <button class="btn-block" onclick="blockIP()">🚫 Block</button>
      </div>
      <div id="blockMsg"></div>
      
      <h2>Blocked IPs (<span id="ipCount">0</span>)</h2>
      <div class="ip-list" id="ipList">
        <div class="empty">No IPs blocked</div>
      </div>
      
      <button class="btn-logout" onclick="logout()">Logout</button>
    </div>
  </div>

  <script>
    // Password
    const ADMIN_PASSWORD = 'admin123';
    
    // Get stored IPs from localStorage
    function getBlockedIPs() {
      return JSON.parse(localStorage.getItem('blockedIPs') || '[]');
    }
    
    // Save IPs to localStorage
    function saveBlockedIPs(ips) {
      localStorage.setItem('blockedIPs', JSON.stringify(ips));
    }
    
    // Update display
    function refreshList() {
      const ips = getBlockedIPs();
      const list = document.getElementById('ipList');
      document.getElementById('ipCount').textContent = ips.length;
      
      if (ips.length === 0) {
        list.innerHTML = '<div class="empty">No IPs blocked</div>';
      } else {
        list.innerHTML = ips.map(ip => `
          <div class="ip-item">
            <span class="ip-text">🚫 ${ip}</span>
            <button class="btn-unblock" onclick="unblockIP('${ip}')">🔓</button>
          </div>
        `).join('');
      }
    }
    
    // Show message
    function showMsg(elementId, text, type) {
      const el = document.getElementById(elementId);
      el.innerHTML = `<div class="message ${type}">${text}</div>`;
      setTimeout(() => el.innerHTML = '', 2000);
    }
    
    // Login
    function login() {
      const pw = document.getElementById('password').value;
      if (pw === ADMIN_PASSWORD) {
        document.getElementById('loginSection').classList.add('hidden');
        document.getElementById('adminSection').classList.remove('hidden');
        refreshList();
      } else {
        showMsg('loginMsg', '❌ Wrong password!', 'error');
      }
    }
    
    // Block IP
    function blockIP() {
      const ip = document.getElementById('ipInput').value.trim();
      if (!ip) return;
      
      // Simple IP validation
      const ipRegex = /^(\d{1,3}\.){3}\d{1,3}$/;
      if (!ipRegex.test(ip)) {
        showMsg('blockMsg', '❌ Invalid IP format!', 'error');
        return;
      }
      
      const ips = getBlockedIPs();
      if (ips.includes(ip)) {
        showMsg('blockMsg', '⚠️ IP already blocked!', 'error');
        return;
      }
      
      ips.push(ip);
      saveBlockedIPs(ips);
      document.getElementById('ipInput').value = '';
      refreshList();
      showMsg('blockMsg', '✅ IP blocked successfully!', 'success');
    }
    
    // Unblock IP
    function unblockIP(ip) {
      let ips = getBlockedIPs();
      ips = ips.filter(i => i !== ip);
      saveBlockedIPs(ips);
      refreshList();
    }
    
    // Logout
    function logout() {
      document.getElementById('loginSection').classList.remove('hidden');
      document.getElementById('adminSection').classList.add('hidden');
      document.getElementById('password').value = '';
    }
  </script>
</body>
</html>
